name: CI/CD

on:
  push:
    branches: [ fork ]
  pull_request:
    branches: [ fork ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.21, 1.22, 1.23]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.4.0

    - name: Run golangci-lint
      run: golangci-lint run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: |
        go build -v ./cmd/netex-validator

    - name: Build for multiple platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o netex-validator-linux-amd64 ./cmd/netex-validator
        GOOS=linux GOARCH=arm64 go build -o netex-validator-linux-arm64 ./cmd/netex-validator
        GOOS=darwin GOARCH=amd64 go build -o netex-validator-darwin-amd64 ./cmd/netex-validator
        GOOS=darwin GOARCH=arm64 go build -o netex-validator-darwin-arm64 ./cmd/netex-validator
        GOOS=windows GOARCH=amd64 go build -o netex-validator-windows-amd64.exe ./cmd/netex-validator

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          netex-validator-linux-*
          netex-validator-darwin-*
          netex-validator-windows-*
